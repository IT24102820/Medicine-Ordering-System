<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard - PharmaGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/pharmago.css">
</head>
<body class="bg-slate-100 text-slate-800">
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex">
                <div class="flex-shrink-0 flex items-center font-bold text-xl text-blue-600">PharmaGo Admin</div>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-8" id="nav-links"></div>
            </div>
            <div class="hidden sm:ml-6 sm:flex sm:items-center" id="nav-user"></div>
        </div>
    </div>
</nav>

<div class="container max-w-7xl mx-auto p-4 sm:p-8 space-y-8">
    <header class="text-center">
        <h1 class="text-4xl font-bold text-slate-700">Finance Dashboard</h1>
        <p class="text-slate-500 mt-2">Monitor payments and manage customer reviews.</p>
    </header>

    <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-2xl font-semibold text-slate-700 mb-5">Payment Details</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-slate-700 uppercase bg-slate-50">
                <tr>
                    <th class="px-6 py-3">Order ID</th>
                    <th class="px-6 py-3">Customer</th>
                    <th class="px-6 py-3">Amount</th>
                    <th class="px-6 py-3">Status</th>
                    <th class="px-6 py-3">Time Left</th>
                    <th class="px-6 py-3 text-center">Action</th>
                </tr>
                </thead>
                <tbody id="payments-body"></tbody>
            </table>
        </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-2xl font-semibold text-slate-700 mb-5">Customer Reviews</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-slate-700 uppercase bg-slate-50">
                <tr>
                    <th class="px-6 py-3">Customer</th>
                    <th class="px-6 py-3">Medicine</th>
                    <th class="px-6 py-3">Rating</th>
                    <th class="px-6 py-3">Comment</th>
                    <th class="px-6 py-3">Status</th>
                    <th class="px-6 py-3 text-center">Action</th>
                </tr>
                </thead>
                <tbody id="reviews-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const paymentsBody = document.getElementById('payments-body');
    const reviewsBody = document.getElementById('reviews-body');
    let paymentInterval;

    async function checkAuth() {
        try {
            const response = await fetch('/api/auth/me');
            if (!response.ok) { window.location.href = '/login.html'; return; }
            const user = await response.json();
            const canViewFinance = ['ROLE_FINANCE_OFFICER', 'ROLE_SUPER_ADMIN'].includes(user.role);
            if (!canViewFinance) {
                alert("Access Denied.");
                window.location.href = '/admin_dashboard.html';
                return;
            }
            populateNav(user);
        } catch (error) { window.location.href = '/login.html'; }
    }

    function populateNav(user) {
        const navLinks = document.getElementById('nav-links');
        const navUser = document.getElementById('nav-user');
        navUser.innerHTML = `<span class="text-sm mr-4">Logged in as ${user.username}</span><form action="/logout" method="post"><button type="submit" class="px-3 py-1 bg-red-500 text-white rounded-md">Logout</button></form>`;

        let navHtml = '<a href="/admin_dashboard.html" class="border-transparent text-gray-500 inline-flex items-center px-1 pt-1 border-b-2 text-sm">Dashboard</a>';
        navHtml += '<a href="/finance_dashboard.html" class="border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Finance</a>';
        if (user.role === 'ROLE_SUPER_ADMIN') {
            navHtml += '<a href="/inventory.html" class="border-transparent text-gray-500 inline-flex items-center px-1 pt-1 border-b-2 text-sm">Inventory</a>';
            navHtml += '<a href="/orders.html" class="border-transparent text-gray-500 inline-flex items-center px-1 pt-1 border-b-2 text-sm">Orders</a>';
            navHtml += '<a href="/user_management.html" class="border-transparent text-gray-500 inline-flex items-center px-1 pt-1 border-b-2 text-sm">User Management</a>';
        }
        navLinks.innerHTML = navHtml;
    }

    function getStatusClass(status) {
        switch (status) {
            case 'SUCCESS': return 'bg-green-100 text-green-800';
            case 'PENDING': return 'bg-yellow-100 text-yellow-800';
            case 'FAILED': return 'bg-red-100 text-red-800';
            default: return 'bg-gray-100 text-gray-800';
        }
    }

    function renderPayments(payments) {
        paymentsBody.innerHTML = '';
        if (payments.length === 0) {
            paymentsBody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-500">No payments found.</td></tr>';
            return;
        }

        payments.forEach(p => {
            const row = document.createElement('tr');
            row.className = 'bg-white border-b';

            let timeLeft = 'N/A';
            if (p.status === 'PENDING') {
                const deadline = new Date(p.creationDate).getTime() + 10 * 60 * 1000;
                const now = new Date().getTime();
                const diff = deadline - now;
                if (diff > 0) {
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    timeLeft = `${minutes}m ${seconds}s`;
                } else {
                    timeLeft = 'Expired';
                }
            }

            row.innerHTML = `
                <td class="px-6 py-4">${p.orderId}</td>
                <td class="px-6 py-4">${p.customerUsername}</td>
                <td class="px-6 py-4">Rs.${p.amount.toFixed(2)}</td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 font-semibold text-xs rounded-full ${getStatusClass(p.status)}">
                        ${p.status}
                    </span>
                </td>
                <td class="px-6 py-4">${timeLeft}</td>
                <td class="px-6 py-4 text-center">
                    ${p.status === 'PENDING' ? `<button onclick="markAsPaid(${p.id})" class="font-medium text-blue-600 hover:underline">Mark as Paid</button>` : ''}
                </td>
            `;
            paymentsBody.appendChild(row);
        });
    }

    function renderReviews(reviews) {
        reviewsBody.innerHTML = '';
        if (reviews.length === 0) {
            reviewsBody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-500">No reviews found.</td></tr>';
            return;
        }
        reviews.forEach(r => {
            const row = document.createElement('tr');
            row.className = 'bg-white border-b';
            row.innerHTML = `
                <td class="px-6 py-4">${r.customerUsername || 'N/A'}</td>
                <td class="px-6 py-4">${r.medicineName || 'N/A'}</td>
                <td class="px-6 py-4">${'★'.repeat(r.rating)}</td>
                <td class="px-6 py-4">${r.comment}</td>
                <td class="px-6 py-4">${r.isApproved ? 'Approved' : 'Pending'}</td>
                <td class="px-6 py-4 text-center">
                    <button onclick="toggleApproval(${r.id}, ${!r.isApproved})" class="font-medium ${r.isApproved ? 'text-red-600 hover:underline' : 'text-green-600 hover:underline'}">
                        ${r.isApproved ? 'Hide' : 'Approve'}
                    </button>
                </td>
            `;
            reviewsBody.appendChild(row);
        });
    }

    async function fetchAllData() {
        try {
            const [paymentsRes, reviewsRes] = await Promise.all([
                fetch('/api/finance/payments'),
                fetch('/api/finance/reviews')
            ]);
            if (paymentsRes.ok) {
                renderPayments(await paymentsRes.json());
            } else {
                paymentsBody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-red-500">Failed to load payments.</td></tr>';
            }
            if (reviewsRes.ok) {
                renderReviews(await reviewsRes.json());
            } else {
                reviewsBody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-red-500">Failed to load reviews.</td></tr>';
            }
        } catch (error) {
            console.error("Failed to fetch finance data:", error);
        }
    }

    async function markAsPaid(paymentId) {
        await fetch(`/api/finance/payments/${paymentId}/success`, { method: 'PUT' });
        fetchAllData();
    }

    async function toggleApproval(reviewId, newStatus) {
        await fetch(`/api/finance/reviews/${reviewId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ isApproved: newStatus })
        });
        fetchAllData();
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        fetchAllData();
        paymentInterval = setInterval(fetchAllData, 5000);
    });

    window.addEventListener('beforeunload', () => {
        if (paymentInterval) {
            clearInterval(paymentInterval);
        }
    });
</script>
</body>
</html>
