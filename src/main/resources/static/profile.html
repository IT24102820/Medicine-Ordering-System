<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - PharmaGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/pharmago.css">
</head>
<body class="bg-slate-100">
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex">
                <div class="flex-shrink-0 flex items-center font-bold text-xl text-blue-600">PharmaGo</div>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                    <a href="/store.html" class="border-transparent text-gray-500 hover:border-gray-300 inline-flex items-center px-1 pt-1 border-b-2 text-sm">Store</a>
                    <a href="/my_orders.html" class="border-transparent text-gray-500 hover:border-gray-300 inline-flex items-center px-1 pt-1 border-b-2 text-sm">My Orders</a>
                    <a href="/profile.html" class="border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">My Profile</a>
                </div>
            </div>
            <div class="flex items-center">
                <form action="/logout" method="post">
                    <button type="submit" class="px-3 py-1 bg-red-500 text-white text-sm rounded-md">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container max-w-4xl mx-auto p-4 sm:p-8 space-y-8">
    <header class="text-center">
        <h1 class="text-4xl font-bold text-slate-700">My Profile</h1>
        <p class="text-slate-500 mt-2">Manage your account details and password.</p>
    </header>

    <!-- Update Profile Details -->
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-semibold text-slate-700 mb-5">Update Details</h2>
        <form id="update-details-form" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium">Username</label>
                <input type="text" id="username" required class="w-full mt-1 p-2 border rounded-md">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium">Email</label>
                <input type="email" id="email" required class="w-full mt-1 p-2 border rounded-md">
            </div>
            <div id="details-message" class="text-sm"></div>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md">Save Changes</button>
        </form>
    </div>

    <!-- Change Password -->
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-semibold text-slate-700 mb-5">Change Password</h2>
        <form id="change-password-form" class="space-y-4">
            <div>
                <label for="oldPassword" class="block text-sm font-medium">Old Password</label>
                <input type="password" id="oldPassword" required class="w-full mt-1 p-2 border rounded-md">
            </div>
            <div>
                <label for="newPassword" class="block text-sm font-medium">New Password</label>
                <input type="password" id="newPassword" required class="w-full mt-1 p-2 border rounded-md">
            </div>
            <div id="password-message" class="text-sm"></div>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md">Change Password</button>
        </form>
    </div>

    <!-- Delete Account -->
    <div class="bg-white p-8 rounded-xl shadow-md border-t-4 border-red-500">
        <h2 class="text-2xl font-semibold text-red-700 mb-5">Delete Account</h2>
        <p class="text-slate-600 mb-4">This action is permanent and cannot be undone. All your data, including order history, will be removed.</p>
        <button id="delete-account-btn" class="px-4 py-2 bg-red-600 text-white rounded-md">Delete My Account</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const detailsForm = document.getElementById('update-details-form');
        const passwordForm = document.getElementById('change-password-form');
        const deleteBtn = document.getElementById('delete-account-btn');
        const detailsMessage = document.getElementById('details-message');
        const passwordMessage = document.getElementById('password-message');

        // Fetch and populate user data
        try {
            const response = await fetch('/api/users/me');
            if (!response.ok) window.location.href = '/login.html';
            const user = await response.json();
            document.getElementById('username').value = user.username;
            document.getElementById('email').value = user.email;
        } catch (e) {
            window.location.href = '/login.html';
        }

        // Handle update details
        detailsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
            };
            const response = await fetch('/api/users/me', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                detailsMessage.textContent = "Details updated successfully! You may need to log in again with your new username.";
                detailsMessage.className = 'text-green-500';
            } else {
                detailsMessage.textContent = `Error: ${await response.text()}`;
                detailsMessage.className = 'text-red-500';
            }
        });

        // Handle change password
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                oldPassword: document.getElementById('oldPassword').value,
                newPassword: document.getElementById('newPassword').value,
            };
            const response = await fetch('/api/users/me/password', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                passwordMessage.textContent = "Password changed successfully!";
                passwordMessage.className = 'text-green-500';
                passwordForm.reset();
            } else {
                passwordMessage.textContent = `Error: ${await response.text()}`;
                passwordMessage.className = 'text-red-500';
            }
        });

        // Handle delete account
        deleteBtn.addEventListener('click', async () => {
            if (confirm('Are you absolutely sure you want to delete your account? This is permanent.')) {
                const response = await fetch('/api/users/me', { method: 'DELETE' });
                if (response.ok) {
                    alert('Account deleted. You have been logged out.');
                    window.location.href = '/logout';
                } else {
                    alert(`Error: ${await response.text()}`);
                }
            }
        });
    });
</script>

</body>
</html>
